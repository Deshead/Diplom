name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      DJANGO_DEBUG: "true"
      CELERY_TASK_ALWAYS_EAGER: "true"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Check code style
        run: python -m ruff check .
      - name: Run tests
        run: python -m coverage run manage.py test
      - name: Show coverage
        run: python -m coverage report

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies for the HTTP check
        run: python -m pip install -r requirements.txt
      - name: Prepare Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build and start containers
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Load demo catalog and accounts
        run: docker compose exec -T web python manage.py seed_demo
      - name: Check HTTP API, Celery and email
        run: python scripts/docker_smoke_test.py
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop containers and remove test data
        if: always()
        run: docker compose down --volumes --remove-orphans

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: orders
          POSTGRES_USER: orders
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orders -d orders"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DJANGO_DEBUG: "true"
      CELERY_TASK_ALWAYS_EAGER: "true"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: test_password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Run tests on PostgreSQL
        run: python -m coverage run manage.py test
      - name: Show coverage
        run: python -m coverage report
